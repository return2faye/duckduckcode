[project]
name = "duckduckcode"
version = "0.1.0"
description = "Minimal Python coding agent shell backed by the OpenAI API"
readme = "README.md"
authors = [
    { name = "return2faye", email = "chongzhenma@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langsmith>=0.10.15",
    "mcp>=1.28,<2",
    "openai>=2.50.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
duckduckcode = "duckduckcode.main:main"
duckduckcode-eval = "duckduckcode.eval:main"
duckduckcode-eval-report = "duckduckcode.eval.report:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.black]
target-version = ["py312"]

[dependency-groups]
dev = [
    "black>=26.5.1",
]
